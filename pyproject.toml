[project]
name = "rithik"
version = "0.1.0"
description = "Rithik Krishna T's command-line card, plus an offline checker for Indian scam messages and links."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rithik Krishna T", email = "trithikkrishna@gmail.com" }]
keywords = ["scam", "phishing", "sms", "upi", "india", "security", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Communications",
]
# Zero runtime dependencies on purpose: `pipx install rithik` should finish in seconds on any
# machine and never break because some transitive package moved.
dependencies = []

[project.urls]
Homepage = "https://github.com/Daemon-VI/rithik"
Issues = "https://github.com/Daemon-VI/rithik/issues"

[project.scripts]
rithik = "rithik.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rithik"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pinned so a newer ruff release cannot change what CI enforces.
select = ["E4", "E7", "E9", "F", "I", "B"]
